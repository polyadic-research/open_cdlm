[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "condila"
version = "0.1.0"
description = "Continuous diffusion language models, training tools, and generation evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "The Condila authors"}]
dependencies = [
    "torch>=2.3,<3", "numpy>=1.24,<2", "scipy>=1.10", "transformers>=4.48.3,<5",
    "safetensors>=0.5.3", "huggingface-hub>=0.28,<1", "einops>=0.7", "pyyaml>=6",
]

[project.optional-dependencies]
train = ["lightning>=2.2,<3", "hydra-core>=1.3,<2", "datasets>=2.18,<4", "fsspec", "requests"]
data = ["datasets>=2.18,<4", "pyarrow>=19,<20"]
tracking = ["wandb>=0.16"]
mauve = ["mauve-text>=0.4", "faiss-cpu"]
topics = ["scikit-learn>=1.0"]
test = ["pytest>=8", "ruff>=0.11", "build>=1", "scikit-learn>=1.0"]
all = [
    "lightning>=2.2,<3", "hydra-core>=1.3,<2", "datasets>=2.18,<4",
    "fsspec", "requests", "pyarrow>=19,<20", "wandb>=0.16",
    "mauve-text>=0.4", "faiss-cpu", "scikit-learn>=1.0",
]

[project.scripts]
condila = "condila.cli:main"
condila-metrics = "condila.dlm_metrics.cli:main"
condila-langflow-train = "condila.cdlm.langflow.cli:main"
condila-langflow-sample = "condila.cdlm.langflow.inference:main"
condila-replaid-prepare = "condila.cdlm.replaid.prepare:main"
condila-replaid-train = "condila.cdlm.replaid.train:main"
condila-replaid-evaluate = "condila.cdlm.replaid.evaluate:main"
condila-replaid-sample = "condila.cdlm.replaid.sample:main"
condila-replaid-score = "condila.cdlm.replaid.score:main"
condila-replaid-reference = "condila.cdlm.replaid.reference:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["condila*", "condia*"]

[tool.setuptools.package-data]
condila = ["py.typed"]
"condila.cdlm.langflow.configs" = ["*.yaml", "model/*.yaml", "data/*.yaml"]
"condila.cdlm.replaid.configs" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: downloads external models or data"]

[tool.ruff]
target-version = "py310"
line-length = 100

