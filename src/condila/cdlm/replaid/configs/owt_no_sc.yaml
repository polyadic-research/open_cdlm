# RePlaid OWT 0.1B benchmark: paper v3, Algorithm 1 and Tables 5, 6, 9, 11.
experiment_id: REPLAID_ORIGINAL_OWT_NO_SC
model:
  tokenizer_name_or_path: openai-community/gpt2
  vocab_size: 50257
  hidden_size: 768
  intermediate_size: 3072
  num_hidden_layers: 12
  num_attention_heads: 12
  max_seq_length: 1024
  cond_dim: 128
  dropout: 0.1
  self_condition_probability: 0.0
  bias_warmup_steps: 5000
  replaid_embedding_dim: 16
  replaid_schedule_hidden_size: 1024
  replaid_gamma_0_init: -3.0
  replaid_gamma_1_init: 6.0
  replaid_reconstruction_ema_decay: 0.997
data:
  directory: data/owt_gpt2
train:
  output_dir: outputs/owt_no_sc
  total_steps: 1000000
  batch_size: 8
  global_batch_size: 512
  learning_rate: 3.0e-4
  special_learning_rate: 1.0e-2
  warmup_steps: 2500
  weight_decay: 0.0
  gamma_bounds_weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.999
  ema_decay: 0.9999
  max_grad_norm: 1.0
  mixed_precision: bf16
  gradient_checkpointing: false
  num_workers: 4
  seed: 42
  log_every: 100
  save_every: 10000
  save_total_limit: 5
  checkpoint_keep_steps: [250000, 1000000]
  eval_every: 10000
  eval_max_batches: 64
  eval_batch_size: 8
  tf32: true
