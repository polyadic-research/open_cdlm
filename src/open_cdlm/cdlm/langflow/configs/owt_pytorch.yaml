# LangFlow with the shared prepared OpenWebText data and batch schedule.
experiment_id: LANGFLOW_OWT
model:
  vocab_size: 50257
  hidden_size: 768
  cond_dim: 128
  n_blocks: 12
  n_heads: 12
  model_length: 1024
  dropout: 0.1
  self_conditioning: true
  use_bias: true
data:
  directory: data/owt_gpt2
train:
  output_dir: outputs/langflow_owt
  total_steps: 1000000
  batch_size: 8
  global_batch_size: 512
  learning_rate: 3.0e-4
  warmup_steps: 5000
  weight_decay: 0.01
  self_condition_probability: 0.25
  bias_warmup_steps: 5000
  scheduler_loss_weight: 1.0
  mixed_precision: bf16
  seed: 42
